<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Claimd vérifie si un pseudo est libre sur plusieurs plateformes.">
  <title>Claimd</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Claimd, accueil">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">Claimd</span>
      </a>
      <span class="topbar__by">by Yexo</span>
    </header>

    <main>
      <section class="hero">
        <h1 class="hero__title">Ton pseudo est-il libre&nbsp;?</h1>
        <p class="hero__lead">Une saisie, toutes les plateformes vérifiées en parallèle.</p>

        <form id="search" class="search" autocomplete="off" novalidate>
          <label for="username" class="sr-only">Pseudo à vérifier</label>
          <span class="search__at" aria-hidden="true">@</span>
          <input id="username" name="username" class="search__input" type="text"
                 placeholder="yexo" maxlength="64" spellcheck="false"
                 autocapitalize="off" autocorrect="off" enterkeyhint="search" autofocus>
          <button id="submit" class="search__button" type="submit">
            <span class="search__button-label">Vérifier</span>
          </button>
        </form>
        <p id="form-error" class="form-error" role="alert" hidden></p>
      </section>

      <section class="results" aria-labelledby="summary">
        <p id="summary" class="summary" aria-live="polite">&nbsp;</p>
        <div id="grid" class="grid" aria-busy="false"></div>
      </section>
    </main>

    <footer class="footer">
      Les vérifications tournent sur ta machine. Les résultats « incertains » ne sont jamais devinés.
    </footer>
  </div>

  <template id="card-template">
    <article class="card" data-state="idle">
      <header class="card__head">
        <span class="card__logo" aria-hidden="true"></span>
        <h2 class="card__name"></h2>
      </header>
      <p class="card__status"><span class="card__dot" aria-hidden="true"></span><span class="card__status-label"></span></p>
      <p class="card__detail"></p>
      <footer class="card__foot">
        <span class="card__reliability"></span>
        <a class="card__link" target="_blank" rel="noopener noreferrer" hidden>Profil ↗</a>
      </footer>
    </article>
  </template>
</body>
</html>
